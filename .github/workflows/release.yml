name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - label: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin
            platform: macos
          - label: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install dependencies
        run: npm ci
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Validate bundle metadata
        run: node ../scripts/check-tauri-config.mjs
        working-directory: client
      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.svg
      - run: npm test
      - run: npm run build
      - name: Build Tauri bundles
        run: npm run tauri build -- --target "${{ matrix.target }}"
      - name: Collect Linux artifacts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p release-assets
          version=$(node -p "require('./package.json').version")
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage release-assets/ZASNet-WX-Broadcast-${version}-Linux-x86_64.AppImage
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb release-assets/ZASNet-WX-Broadcast-${version}-Linux-amd64.deb
      - name: Collect Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $version = node -p "require('./package.json').version"
          Copy-Item (Get-ChildItem src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi | Select-Object -First 1) "release-assets/ZASNet-WX-Broadcast-$version-Windows-x64.msi"
      - name: Collect macOS artifacts
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p release-assets
          version=$(node -p "require('./package.json').version")
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/ZASNet-WX-Broadcast-${version}-macOS-arm64.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.platform }}
          path: client/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZASNet WX Broadcast Graphics ${{ github.ref_name }}
          body: |
            ZASNet WX Broadcast Graphics ${{ github.ref_name }}

            Desktop builds for Windows, macOS, and Linux.

            Current scope: Level III base reflectivity rendering, MapLibre map, GPU palettes, smoothing modes, and fullscreen program output.

            Development build — artifacts are currently unsigned and macOS packages are not notarized.
          files: release-assets/*
          fail_on_unmatched_files: true
