[package]
name = "zasnet-wx-broadcast-client"
version = "0.4.0"
description = "ZASNet WX Broadcast Graphics workstation"
authors = ["ZASNet"]
edition = "2021"

[lib]
name = "zasnet_wx_broadcast_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
